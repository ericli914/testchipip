# Clock scheduling in the Chipyard wrapper must be verified.
Frontend:
  impl: Chipyard
  clock_ratio: 8
MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3
  DRAM:
    impl: DDR3
    org:
      preset: DDR3_4Gb_x8
      channel: 1
      rank: 1
      channel_width: 64
    timing:
      preset: DDR3_1600J
  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
    plugins: null
  AddrMapper:
    impl: RoBaRaCoCh
